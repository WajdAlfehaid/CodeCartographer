{% extends "base.html" %}
{% block title %}Analysis — CodeCartographer{% endblock %}
{% block subtitle %}analysis{% endblock %}
{% block actions %}
<a class="btn" href="{{ url_for('export', kind='markdown') }}?run={{ run }}">Markdown</a>
<a class="btn" href="{{ url_for('export', kind='html') }}?run={{ run }}">Standalone HTML</a>
<a class="btn" href="{{ url_for('export', kind='json') }}?run={{ run }}">JSON</a>
<a class="btn" href="{{ url_for('index') }}">New analysis</a>
{% endblock %}
{% block content %}
<div class="hero" id="hero"><h1>Loading…</h1></div>
<div class="stats" id="stats"></div>

<div class="tabs" role="tablist">
  <button class="tab" data-tab="map" role="tab" aria-selected="true">Map</button>
  <button class="tab" data-tab="risk" role="tab">Risk<span class="count"></span></button>
  <button class="tab" data-tab="dead" role="tab">Dead code<span class="count"></span></button>
  <button class="tab" data-tab="smells" role="tab">Problems<span class="count"></span></button>
  <button class="tab" data-tab="business" role="tab">Business rules<span class="count"></span></button>
  <button class="tab" data-tab="files" role="tab">Files<span class="count"></span></button>
  <button class="tab" data-tab="quality" role="tab">Confidence</button>
</div>

<div id="panels">
  <div class="panel active" id="panel-map"></div>
  <div class="panel" id="panel-risk"></div>
  <div class="panel" id="panel-dead"></div>
  <div class="panel" id="panel-smells"></div>
  <div class="panel" id="panel-business"></div>
  <div class="panel" id="panel-files"></div>
  <div class="panel" id="panel-quality"></div>
</div>
{% endblock %}
{% block scripts %}
<script>window.__RUN__ = {{ run|tojson }};</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
